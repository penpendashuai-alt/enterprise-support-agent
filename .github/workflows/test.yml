name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.12.5"
    - name: Install dependencies with uv
      run: |
        uv sync --frozen
      env:
        UV_SYSTEM_PYTHON: 1
    - name: Lint and format with ruff
      run: |
        uv run ruff format --check
        uv run ruff check --output-format github

    - name: Type check with pyrefly
      run: |
        uv run pyrefly check

    - name: Test with pytest
      run: |
        uv run pytest --cov=src/ --cov-report=xml

    - name: Check offline benchmark reproducibility
      run: python scripts/summarize_phase10.py --check

  lint-markdown:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: "pyproject.toml"
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: "0.12.5"
    - name: Install dependencies with uv
      run: |
        uv sync --frozen --only-group dev
      env:
        UV_SYSTEM_PYTHON: 1
    - name: Lint markdown with pymarkdown
      run: |
        uv run pymarkdown scan README.md docs/

  test-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
      - name: Install locked test dependencies
        run: uv sync --frozen
      - name: Build both images
        run: docker compose --env-file docker/ci.env -f compose.yaml -f compose.local.yaml -f compose.ci.yaml build
      - name: Verify Support Agent with real infrastructure
        run: uv run python scripts/verify_phase9_containers.py --project esa-p9-test-${{ github.run_id }}-${{ github.run_attempt }} --output evaluation/phase9/ci-${{ github.run_id }}
      - name: Verify Redis memory pressure and recovery
        run: uv run python scripts/verify_phase9_redis_memory.py --project esa-p9-test-memory-${{ github.run_id }}-${{ github.run_attempt }} --output evaluation/phase9/closeout/redis-memory-ci-${{ github.run_id }}
      - name: Verify real Service tracing against local OTLP receiver
        run: uv run python scripts/verify_phase9_business_tracing.py --project esa-p9-test-tracing-${{ github.run_id }}-${{ github.run_attempt }} --output evaluation/phase9/closeout/business-tracing-ci-${{ github.run_id }} --receiver local
      - name: Upload sanitized acceptance records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase9-container-records
          path: |
            evaluation/phase9/ci-*/
            evaluation/phase9/closeout/*-ci-*/
      - name: Clean only this run's project
        if: always()
        run: |
          for suffix in "${{ github.run_id }}-${{ github.run_attempt }}" "memory-${{ github.run_id }}-${{ github.run_attempt }}" "tracing-${{ github.run_id }}-${{ github.run_attempt }}"; do
            docker compose --env-file docker/ci.env -p "esa-p9-test-$suffix" -f compose.yaml -f compose.local.yaml -f compose.ci.yaml down --volumes --remove-orphans
          done
