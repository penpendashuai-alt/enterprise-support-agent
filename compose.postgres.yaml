services:
  postgres:
    image: postgres:17.11
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local development password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise_support}
    volumes:
      - phase6_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1g
volumes:
  phase6_postgres_data:
